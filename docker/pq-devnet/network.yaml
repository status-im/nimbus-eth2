# Single-client Nimbus PQ devnet: ethDreamer's network.yaml with Nimbus in
# place of Lighthouse. Validators run inside the beacon node (PQ signing is
# local only).
participants:
  - el_type: geth
    el_image: ethpandaops/geth:master@sha256:718bbb359e74c42004e23470082dd1db295e484397d00cce9b8e29d4fad0d1e6
    cl_type: nimbus
    cl_image: nimbus-pq:dev
    use_separate_vc: false
    count: 2
    validator_count: 32
    supernode: true
    cl_extra_params:
      - --subscribe-all-subnets
    cl_extra_env_vars:
      LEANVM_THREADS: "4"

network_params:
  preset: mainnet
  network_id: "3151908"
  num_validator_keys_per_node: 32
  seconds_per_slot: 12
  slot_duration_ms: 12000
  # Allow time for key/VRF setup, the prover, and both validator clients.
  genesis_delay: 300
  genesis_time: 0
  altair_fork_epoch: 0
  bellatrix_fork_epoch: 0
  capella_fork_epoch: 0
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  pq_fork_epoch: 0
  heze_fork_epoch: 18446744073709551615
  builder_count: 0
  shuffle_genesis_validators: false
ethereum_genesis_generator_params:
  image: ethpandaops/ethereum-genesis-generator:pq@sha256:222c4ebd703c4e22b0f5aaac9aa5aa14a2f8cec45610c27102dbd5bcce19871c
# Self-built payloads; no external builder or remote signer.
checkpoint_sync_enabled: false
additional_services:
  - spamoor
  - dora
dora_params:
  image: ethdreamer/dora:pq@sha256:b0e56f85301dd53c386233cfb8f1e893f9ffef3ee953148af30ddebb0c987aa7
