name: CI
on:
  push:
    paths-ignore: ['media/**', 'docs/**', '**/*.md']
    branches:
      - stable
      - testing
      - unstable
  pull_request:
    paths-ignore: ['media/**', 'docs/**', '**/*.md']
    branches-ignore:
      - stable
  workflow_dispatch:

concurrency: # Cancel stale PR builds (but not push builds)
  group: ${{ github.workflow }}-top-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@a7b20ad8dbee60830223c2f2a86eaf5e1aa696ba  # main
    with:
      targets: '[{"linux-amd64": ["self-hosted", "ubuntu-22.04"]}, "macos-arm64", {"windows-amd64": "windows-2022"}]'
      nim-versions: '["./vendor/nimbus-build-system/vendor/Nim"]'
      install-command: &install |
        # Stack usage test on recent enough gcc:
        if [[ "${RUNNER_OS}" == 'Linux' && "${CPU}" == 'amd64' ]]; then
          export NIMFLAGS="${NIMFLAGS} -d:limitStackUsage"
        fi

        if [[ "${RUNNER_OS}" == 'Windows' ]]; then
          export NIMFLAGS="${NIMFLAGS} --cc:clang"
        fi

        if [[ "${NIM_VERSION}" == version-* ]]; then
          export NIMFLAGS="${NIMFLAGS} --mm:refc"
        fi

        ncpu=""
        make_cmd="make"
        case "${RUNNER_OS}" in
        'Linux')
          ncpu=$(nproc)
          ;;
        'macOS')
          ncpu=$(sysctl -n hw.ncpu)
          ;;
        'Windows')
          ncpu=${NUMBER_OF_PROCESSORS}
          make_cmd="mingw32-make"
          echo "Number of cores: ${NUMBER_OF_PROCESSORS}"
          echo "Physical memory: $(wmic ComputerSystem get TotalPhysicalMemory)"
          echo "Partition sizes: $(wmic partition get name,size,type)"
          # for miniupnp that runs "wingenminiupnpcstrings.exe" from the current dir
          export PATH=".:${PATH}"
          choco install nasm --no-progress -y
          export PATH="/c/Program Files/NASM:${PATH}"
          ;;
        esac
        [[ -z "$ncpu" || $ncpu -le 0 ]] && ncpu=1

        # Drop the compiler commands that V=1 prints, so the log stays followable
        filter_cc() {
          grep --line-buffered -vE '^(gcc|g\+\+|clang|clang\+\+)(-[0-9]+)?(\.exe)? ' || true
        }

        echo "::group::Build Nimbus dependencies"
        ${make_cmd} -j "${ncpu}" USE_SYSTEM_NIM=1 ARCH_OVERRIDE="${PLATFORM}" update
        echo "::endgroup::"
      test-command: &test |
        echo "::group::Build binaries (with trace logging enabled)"
        ${make_cmd} -j "${ncpu}" V=1 USE_SYSTEM_NIM=1 LOG_LEVEL=TRACE NIMFLAGS="-u:release --opt:none ${NIMFLAGS}" | filter_cc
        # The Windows image runs out of disk space, so make some room
        rm -rf build nimcache
        echo "::endgroup::"

        echo "::group::Get the Ethereum Foundation fixtures"
        scripts/setup_scenarios.sh fixturesCache
        echo "::endgroup::"

        echo "::group::Run tests"
        ${make_cmd} -j "${ncpu}" V=1 USE_SYSTEM_NIM=1 DISABLE_TEST_FIXTURES_SCRIPT=1 test | filter_cc
        echo "::endgroup::"

  build-upstream:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@a7b20ad8dbee60830223c2f2a86eaf5e1aa696ba  # main
    with:
      targets: '[{"linux-amd64": ["self-hosted", "ubuntu-22.04"]}]'
      nim-versions: '["version-2-2", "version-2-4"]'
      concurrency-suffix: upstream
      install-command: *install
      test-command: *test

  build-asan:
    # For 1 in 16 commits
    if: startsWith(github.sha, '7')
    name: 'build-asan (${{ matrix.tests }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tests: spectests, sanitizer: address}
          - {tests: alltests, sanitizer: address}
          - {tests: tsan, sanitizer: thread}
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@a7b20ad8dbee60830223c2f2a86eaf5e1aa696ba  # main
    with:
      targets: '["linux-amd64"]'
      nim-versions: '["version-2-2"]'
      concurrency-suffix: asan-${{ matrix.tests }}
      install-command: *install
      test-command: |
        # UBSan flags refc's code for `""` passed to `openArray` (llvm/llvm-project#235503, nim-lang/Nim#26549)
        git -C vendor/nim-blscurve apply --unidiff-zero <<'EOF' || true
        --- a/blscurve/bls_batch_verifier.nim
        +++ b/blscurve/bls_batch_verifier.nim
        @@ -144 +144 @@
        -  ctx.init(secureRandomBytes, "")
        +  ctx.init(secureRandomBytes, array[0, byte]([]))
        --- a/blscurve/blst/blst_min_pubkey_sig_core.nim
        +++ b/blscurve/blst/blst_min_pubkey_sig_core.nim
        @@ -243 +243 @@
        -  blst_hash_to_g2(toCV(sig, cblst_p2), message, domainSepTag, aug = "")
        +  blst_hash_to_g2(toCV(sig, cblst_p2), message, domainSepTag, aug = array[0, byte]([]))
        @@ -264 +264 @@
        -    aug = ""
        +    aug = array[0, byte]([])
        @@ -289 +289 @@
        -    aug = ""
        +    aug = array[0, byte]([])
        @@ -338 +338 @@
        -    aug = ""
        +    aug = array[0, byte]([])
        @@ -390,2 +390,2 @@
        -      msg = "",
        -      aug = ""
        +      msg = array[0, byte]([]),
        +      aug = array[0, byte]([])
        @@ -403,2 +403,2 @@
        -        msg = "",
        -        aug = ""
        +        msg = array[0, byte]([]),
        +        aug = array[0, byte]([])
        @@ -565 +565 @@
        -    aug = ""
        +    aug = array[0, byte]([])
        --- a/blscurve/eth2_keygen/bls_spec_keygen_blst.nim
        +++ b/blscurve/eth2_keygen/bls_spec_keygen_blst.nim
        @@ -73 +73 @@
        -  blst_keygen(toCV(secretKey, cblst_scalar), ikm, info = "")
        +  blst_keygen(toCV(secretKey, cblst_scalar), ikm, info = array[0, byte]([]))
        EOF
        git -C vendor/nim-eth apply --unidiff-zero <<'EOF' || true
        --- a/eth/rlp/results.nim
        +++ b/eth/rlp/results.nim
        @@ -22 +22 @@
        -    w.append("")
        +    w.append(array[0, byte]([]))
        EOF

        # https://clang.llvm.org/docs/AddressSanitizer.html
        export ASAN_OPTIONS="detect_leaks=0:detect_stack_use_after_return=0"
        # https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html
        export UBSAN_OPTIONS="print_stacktrace=1"
        # https://clang.llvm.org/docs/ThreadSanitizer.html
        sanitizer="${{ matrix.sanitizer }}"
        nim_flags=(--cc:clang -d:disableLTO)
        san_flags=(
          "-fsanitize=${sanitizer},undefined"
          -fno-sanitize-recover=undefined
          -fno-sanitize-merge
          -fno-omit-frame-pointer
        )
        for flag in "${san_flags[@]}"; do
          nim_flags+=("--passC:${flag}")
        done
        nim_flags+=("--passL:-fsanitize=${sanitizer},undefined")
        if [[ "${sanitizer}" == thread ]]; then
          nim_flags+=(-d:taskpoolsTsan)
        fi

        tests="${{ matrix.tests }}"
        if [[ "${tests}" == tsan ]]; then
          # Only the tests that reach nimbus-eth2's own taskpool code
          nim_flags+=(-d:release)
          modules=(
            test_block_processor
            test_gossip_validation
            test_payload_attestation_pool
            test_peerdas_helpers
          )

          echo "::group::Build NAT libraries"
          ${make_cmd} -j "${ncpu}" USE_SYSTEM_NIM=1 nat-libs
          echo "::endgroup::"

          export USE_SYSTEM_NIM=1
          source env.sh

          echo "::group::Build tests"
          for module in "${modules[@]}"; do
            nim c "${nim_flags[@]}" -o:"build/tsan_${module}" "tests/${module}.nim"
          done
          echo "::endgroup::"

          echo "::group::Run tests"
          for module in "${modules[@]}"; do
            "build/tsan_${module}"
          done
          echo "::endgroup::"
        else
          export NIMFLAGS="${nim_flags[*]}"

          # make checks `which $(CC)`, so test_libnimbus_lc gets the flags through a wrapper
          cc_san="${RUNNER_TEMP}/cc-san"
          {
            echo '#!/bin/sh'
            echo "exec clang ${san_flags[*]} \"\$@\""
          } > "${cc_san}"
          chmod +x "${cc_san}"

          # Nim archives clang static libraries with llvm-ar, which the Ubuntu image lacks
          if ! command -v llvm-ar >/dev/null; then
            mkdir -p "${RUNNER_TEMP}/bin"
            ln -s "$(command -v ar)" "${RUNNER_TEMP}/bin/llvm-ar"
            export PATH="${RUNNER_TEMP}/bin:${PATH}"
          fi

          echo "::group::Get the Ethereum Foundation fixtures"
          scripts/setup_scenarios.sh fixturesCache
          echo "::endgroup::"

          if [[ "${tests}" == spectests ]]; then
            selection=("XML_TEST_BINARIES=\$(XML_TEST_BINARIES_CORE)" TEST_BINARIES=)
          else
            selection=(XML_TEST_BINARIES_CORE=)
          fi
          echo "::group::Run tests"
          ${make_cmd} -j "${ncpu}" V=1 USE_SYSTEM_NIM=1 CC="${cc_san}" DISABLE_TEST_FIXTURES_SCRIPT=1 "${selection[@]}" test | filter_cc
          echo "::endgroup::"
        fi

  build-dev:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@a7b20ad8dbee60830223c2f2a86eaf5e1aa696ba  # main
    with:
      targets: '[{"linux-amd64": ["self-hosted", "ubuntu-22.04"]}]'
      nim-versions: '["./vendor/nimbus-build-system/vendor/Nim"]'
      concurrency-suffix: dev
      install-command: |
        echo "::group::Build Nimbus dependencies"
        make -j USE_SYSTEM_NIM=1 update
        echo "::endgroup::"
      test-command: |
        # Build files with isMainModule that the Makefile doesn't build
        makefile_content=$(<./Makefile)
        executables=()
        while IFS= read -r file; do
          base=$(basename "$file" ".nim")
          if ! grep -qw "$base" <<< "$makefile_content"; then
            executables+=("$file")
          fi
        done < <(git grep -l "when isMainModule:" -- '*.nim')
        export USE_SYSTEM_NIM=1
        source env.sh
        for executable in "${executables[@]}"; do
          # noLinking broken on 2.2.14: https://github.com/nim-lang/Nim/pull/26061
          # workaround with --spawncodegen:off
          nim c --passC:-fsyntax-only --noLinking:on --spawncodegen:off -d:chronicles_log_level=TRACE "${executable}"
        done

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # In PR, has extra merge commit: ^1 = PR, ^2 = base
          submodules: 'recursive'

      - name: Check copyright year
        run: |
          excluded_files="config.yaml|config.nims|beacon_chain.nimble|Makefile|Product.wxs"
          excluded_extensions="ans|bin|cfg|yml|json|json\\.template|md|png|service|ssz|tpl|txt|lock|nix|gitignore|envrc|sh"

          current_year=$(date +"%Y")
          problematic_files=()
          while read -r file; do
            if ! grep -qE 'Copyright \(c\) .*'$current_year' Status Research & Development GmbH' "$file"; then
              problematic_files+=("$file")
            fi
          done < <(git diff --name-only --diff-filter=AM --ignore-submodules HEAD^ HEAD | grep -vE '(\.('$excluded_extensions')|'$excluded_files')$' || true)

          if (( ${#problematic_files[@]} )); then
            echo "The following files do not have an up-to-date copyright year:"
            for file in "${problematic_files[@]}"; do
              echo "- $file"
            done
            exit 2
          fi

      - name: Check exception tracking
        run: |
          scripts/check_exception_headers.sh

      - name: Check submodules
        run: |
          scripts/check_submodule_branches.sh

      - name: Check spec presets
        run: |
          scripts/check_presets.sh
